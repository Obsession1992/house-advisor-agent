<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Advisor Agent — 徐亚东</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --green: #39d353;
    --green-dim: #238636;
    --green-glow: rgba(57, 211, 83, 0.25);
    --text: #e6edf3;
    --text-dim: #8b949e;
    --border: #30363d;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow: hidden;
  }

  /* ── scan-line overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(57, 211, 83, 0.015) 2px,
      rgba(57, 211, 83, 0.015) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    width: 100%;
    text-align: center;
  }

  /* ── terminal header ── */
  .terminal-tag {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--green);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0.7;
  }

  .terminal-tag::before { content: '> '; }
  .terminal-tag::after { content: ' _'; animation: blink 1s step-end infinite; }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── title ── */
  h1 {
    font-family: var(--mono);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    color: var(--green);
    margin-bottom: 0.5rem;
    text-shadow: 0 0 20px var(--green-glow);
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ── cards ── */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 2.5rem;
  }

  @media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 2rem 1.25rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    opacity: 0;
    background: radial-gradient(ellipse at center, var(--green-glow), transparent 70%);
    transition: opacity 0.3s ease;
  }

  .card:hover {
    border-color: var(--green);
    transform: translateY(-3px);
    box-shadow: 0 0 24px var(--green-glow), 0 8px 32px rgba(0,0,0,0.4);
  }

  .card:hover::before { opacity: 1; }

  .card-icon {
    font-size: 2.2rem;
    position: relative;
    z-index: 1;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }

  .card-hint {
    font-size: 0.75rem;
    color: var(--text-dim);
    position: relative;
    z-index: 1;
  }

  /* ── author ── */
  .author-block {
    border-top: 1px solid var(--border);
    padding-top: 2rem;
    margin-bottom: 1rem;
  }

  .author-name {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 0.35rem;
  }

  .author-title {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }

  /* ── contact ── */
  .contact-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .contact-row a {
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s;
  }

  .contact-row a:hover { color: var(--green); }

  .contact-row .icon { margin-right: 0.35rem; }

  /* ── footer ── */
  .footer {
    margin-top: 2.5rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="container">

  <div class="terminal-tag">house-advisor-agent</div>

  <h1>House Advisor</h1>

  <p class="subtitle">
    基于AI Agent的住宅选房决策系统 —— 从户型合规审查、规划条件推演到财务可行性分析，全链路智能辅助，让每一套房都经得起专业审视。
  </p>

  <div class="cards">
    <a class="card" href="portfolio_obsession_merged.html">
      <span class="card-icon">📋</span>
      <span class="card-label">求职作品集</span>
      <span class="card-hint">完整项目展示 · 11页</span>
    </a>
    <a class="card" href="demo_海狮沟.html">
      <span class="card-icon">🏠</span>
      <span class="card-label">真实案例演示</span>
      <span class="card-hint">海狮沟 · 实盘推演</span>
    </a>
  </div>

  <div class="author-block">
    <div class="author-name">徐亚东（Obsession）</div>
    <div class="author-title">一级注册建筑师 · AI产品经理</div>
    <div class="contact-row">
      <a href="mailto:40184712@qq.com"><span class="icon">✉</span>40184712@qq.com</a>
      <a href="https://github.com/Obsession1992/house-advisor-agent" target="_blank" rel="noopener"><span class="icon">⌘</span>GitHub</a>
    </div>
  </div>

  <div class="footer">// built with obsession · 2025</div>

</div>

</body>
</html>
