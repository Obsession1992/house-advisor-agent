<!--
  Obsession 购房决策助手 - 自定义 AI 聊天界面
  部署到 Vercel 即可使用，API 代理和静态页面同源，无跨域问题。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>obsession-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0d1117;
    --bar-bg: #161b22;
    --accent: #39d353;
    --accent-dim: rgba(57, 211, 83, 0.15);
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --border: #30363d;
    --user-bubble-bg: #1a2332;
    --bot-bubble-bg: #161b22;
    --error: #f85149;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
  }

  /* ─ 顶部栏 ── */
  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    flex-shrink: 0;
    height: 56px;
    background: var(--bar-bg);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
  }

  .topbar__title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 20px;
    background: var(--accent);
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .topbar__back {
    position: absolute;
    right: 20px;
    font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .topbar__back:hover {
    color: var(--accent);
  }

  /* ── 聊天区域 ── */
  .chat-area {
    width: 100%;
    max-width: 780px;
    max-height: calc(100vh - 180px);
    overflow-y: auto;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
  }

  .chat-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .chat-area::-webkit-scrollbar {
    width: 6px;
  }

  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }

  .chat-area::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .chat-area::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }

  /* ── 消息气泡 ── */
  .message {
    max-width: 80%;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message--bot {
    align-self: flex-start;
  }

  .message--user {
    align-self: flex-end;
    margin-left: auto;
  }

  .message__bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .message--bot .message__bubble {
    background: var(--bot-bubble-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px 12px 12px 12px;
  }

  .message--user .message__bubble {
    background: var(--user-bubble-bg);
    border: 1px solid var(--accent);
    border-radius: 12px 4px 12px 12px;
    text-align: left;
  }

  .message__label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .message--user .message__label {
    text-align: right;
  }

  /* ── 打字指示器 ── */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    background: var(--bot-bubble-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px 12px 12px 12px;
    width: fit-content;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }

  .typing-indicator__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingPulse 1.4s ease-in-out infinite;
  }

  .typing-indicator__dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator__dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingPulse {
    0%, 80%, 100% {
      transform: scale(0.4);
      opacity: 0.3;
    }
    40% {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* ── 错误提示 ── */
  .error-msg {
    color: var(--error);
    font-size: 13px;
    padding: 10px 16px;
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid var(--error);
    border-radius: 8px;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }

  /* ── 输入栏 ── */
  .input-bar {
    width: 100%;
    max-width: 780px;
    padding: 16px 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .input-bar__inner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .input-bar__field {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    line-height: 1.4;
    max-height: 120px;
    overflow-y: auto;
  }

  .input-bar__field::placeholder {
    color: var(--text-muted);
  }

  .input-bar__field:focus {
    border-color: var(--accent);
  }

  .input-bar__field:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .input-bar__send {
    flex-shrink: 0;
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .input-bar__send:hover {
    opacity: 0.9;
  }

  .input-bar__send:active {
    transform: scale(0.96);
  }

  .input-bar__send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ── Markdown 渲染 ── */
  .md-content strong, .md-content b {
    font-weight: 700;
    color: var(--accent);
  }

  .md-content code {
    background: rgba(57, 211, 83, 0.1);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    color: var(--accent);
  }

  .md-content pre {
    background: rgba(0, 0, 0, 0.4);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    border-left: 2px solid var(--accent);
  }

  .md-content pre code {
    background: none;
    padding: 0;
    color: var(--text);
  }

  .md-content ul, .md-content ol {
    padding-left: 20px;
    margin: 6px 0;
  }

  .md-content li {
    margin: 3px 0;
  }

  .md-content p {
    margin: 6px 0;
  }

  .md-content p:first-child {
    margin-top: 0;
  }

  .md-content p:last-child {
    margin-bottom: 0;
  }

  .md-content a {
    color: var(--accent);
    text-decoration: underline;
  }

  .md-content blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--text-muted);
  }

  /* ── 移动端适配 ── */
  @media (max-width: 600px) {
    .topbar {
      height: 48px;
      padding: 0 12px;
    }

    .topbar__title {
      font-size: 13px;
    }

    .cursor {
      width: 8px;
      height: 16px;
    }

    .topbar__back {
      font-size: 11px;
    }

    .chat-area {
      padding: 16px 12px;
      max-height: calc(100vh - 150px);
    }

    .message {
      max-width: 90%;
    }

    .message__bubble {
      font-size: 13px;
      padding: 10px 12px;
    }

    .input-bar {
      padding: 12px;
      gap: 8px;
    }

    .input-bar__inner {
      max-width: 100%;
    }

    .input-bar__field {
      font-size: 13px;
      padding: 8px 12px;
    }

    .input-bar__send {
      padding: 8px 14px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar__title">
      &gt; obsession-agent<span class="cursor"></span>
    </div>
    <a class="topbar__back" href="index.html">← 返回作品集</a>
  </header>

  <!-- 聊天区域 -->
  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <!-- 输入栏 -->
  <div class="input-bar">
    <div class="input-bar__inner">
      <textarea
        class="input-bar__field"
        id="inputField"
        placeholder="输入你的问题..."
        rows="1"
      ></textarea>
      <button class="input-bar__send" id="sendBtn">发送 ▶</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ── 配置 ──
  const API_ENDPOINT = '/api/chat';
  const BOT_ID = '7667421523694665766';
  const TOKEN = 'eyJhbGciOiJSUzI1NiIsImtpZCI6Ijk4YTg5OTViLTJjMmQtNDEwMS1iOGQ5LWMwNzEzZGFjYjVhZCJ9.eyJpc3MiOiJodHRwczovL2FwaS5jb3plLmNuIiwiYXVkIjpbImR6WHNxWVpvV3VNVUJwVzdCdHpDVTZJVGJUQVZMQnJMIl0sImV4cCI6ODIxMDI2Njg3Njc5OSwiaWF0IjoxNzg1NjM4OTExLCJzdWIiOiJzcGlmZmU6Ly9hcGkuY296ZS5jbi93b3JrbG9hZF9pZGVudGl0eS9pZDo3NjY3NDM4OTYyMzY5MTAxODc0Iiwic3JjIjoiaW5ib3VuZF9hdXRoX2FjY2Vzc190b2tlbl9pZDo3NjY5MjYwNzI1MTAxMDAyODAzIn0.B759UNeCueTjkBgKiQJSpnTAWtjcq5Sa0MqZeHe2MaGYQZGcsbhVC4cv7BZgd3MsMSI9BWxsNyw75C1kJsIp7VGtQbFY9CQTeqki8OugTQHNNaRV3maPPuq8ifl9DYzgu8Sufq7unwTgr12oMd66dNEoBbyb1ZwbCNO9HRgsX_61g7Io0ugP5X5t6uE7x1uhbmibmNJxa224NBP81YoFPSwENfV6XtGnKaUcUK2_UbChUdRrvUbVy4OU0nclA7ZITNo1QTbPGYN2mFfvXJdseF9HVHNW-3Mx5QJLDNyO7SqYlhLa4tjmTsmkTpVFdcVZBCbAqABpvOuQTOE0j6ek2A';

  // 固定 user_id 以支持多轮对话上下文
  const USER_ID = 'portfolio_visitor_' + Math.random().toString(36).slice(2, 10);

  // ── DOM 引用 ──
  const chatArea = document.getElementById('chatArea');
  const chatInner = document.getElementById('chatInner');
  const inputField = document.getElementById('inputField');
  const sendBtn = document.getElementById('sendBtn');

  // ── 状态 ──
  let conversationId = null;
  let isSending = false;

  // ── Markdown 简易渲染 ──
  function renderMarkdown(text) {
    // 转义 HTML
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // 代码块 ```
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });

    // 行内代码
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // 粗体
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

    // 链接
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // 引用块
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

    // 无序列表
    html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    // 合并相邻的 ul
    html = html.replace(/<\/ul>\s*<ul>/g, '');

    // 有序列表
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

    // 段落：双换行分段
    html = html.replace(/\n\n/g, '</p><p>');
    // 单换行 → <br>
    html = html.replace(/\n/g, '<br>');

    // 包裹在 p 中
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>\s*<\/p>/g, '');
    html = html.replace(/<p>\s*(<pre>|<ul>|<ol>|<blockquote>)/g, '$1');
    html = html.replace(/(<\/pre>|<\/ul>|<\/ol>|<\/blockquote>)\s*<\/p>/g, '$1');

    return html;
  }

  // ── UI 操作 ──
  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    });
  }

  function addUserMessage(text) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message message--user';
    wrapper.innerHTML = `
      <div class="message__label">你</div>
      <div class="message__bubble"></div>
    `;
    wrapper.querySelector('.message__bubble').textContent = text;
    chatInner.appendChild(wrapper);
    scrollToBottom();
  }

  function createBotMessage() {
    const wrapper = document.createElement('div');
    wrapper.className = 'message message--bot';
    wrapper.innerHTML = `
      <div class="message__label">🤖 购房助手</div>
      <div class="message__bubble md-content"></div>
    `;
    chatInner.appendChild(wrapper);
    scrollToBottom();
    return wrapper.querySelector('.message__bubble');
  }

  function showTypingIndicator() {
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.id = 'typingIndicator';
    indicator.innerHTML = `
      <div class="typing-indicator__dot"></div>
      <div class="typing-indicator__dot"></div>
      <div class="typing-indicator__dot"></div>
    `;
    chatInner.appendChild(indicator);
    scrollToBottom();
  }

  function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function showError(text) {
    const err = document.createElement('div');
    err.className = 'error-msg';
    err.textContent = text;
    chatInner.appendChild(err);
    scrollToBottom();
    // 5秒后自动移除
    setTimeout(() => err.remove(), 5000);
  }

  function setInputEnabled(enabled) {
    inputField.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) {
      inputField.focus();
    }
  }

  // ── 输入框自动增高 ──
  inputField.addEventListener('input', () => {
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px';
  });

  // ── 发送消息 ──
  async function sendMessage(userText) {
    if (!userText.trim() || isSending) return;

    isSending = true;
    setInputEnabled(false);
    inputField.value = '';
    inputField.style.height = 'auto';

    addUserMessage(userText);
    showTypingIndicator();

    const bubble = createBotMessage();
    let fullText = '';

    try {
      const requestBody = {
        bot_id: BOT_ID,
        user_id: USER_ID,
        stream: true,
        auto_save_history: true,
        additional_messages: [{
          role: 'user',
          content: userText,
          content_type: 'text'
        }]
      };

      // 如果有 conversation_id，传入以支持多轮对话
      if (conversationId) {
        requestBody.conversation_id = conversationId;
      }

      let response;

      try {
        // 直连 Coze API
        response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });
      } catch (corsErr) {
        // CORS 兜底：尝试通过 allorigins 代理
        // 注意：代理方案可能不适用于 POST + stream，仅作为提示
        console.warn('直连失败，可能是 CORS 问题:', corsErr.message);
        showError('连接失败，当前部署环境可能不支持直连 API。请将页面部署在 Coze 允许的域名下，或在本地打开本文件使用。');
        hideTypingIndicator();
        bubble.remove();
        isSending = false;
        setInputEnabled(true);
        return;
      }

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API 返回 ${response.status}: ${errText.slice(0, 200)}`);
      }

      // 处理 SSE 流式响应
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      hideTypingIndicator();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // 按行分割处理 SSE
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;

          const dataStr = line.slice(6).trim();
          if (!dataStr || dataStr === '[DONE]') continue;

          let data;
          try {
            data = JSON.parse(dataStr);
          } catch {
            continue;
          }

          // Coze v2 chat stream 事件格式
          // event 类型: conversation.chat.created, conversation.chat.in_progress, conversation.chat.completed
          // 以及 conversation.message.delta / conversation.message.completed

          if (data.event === 'conversation.chat.created' || data.type === 'conversation.chat.created') {
            // 获取 conversation_id 和 chat_id
            const chatData = data.data || data;
            if (chatData.conversation_id) {
              conversationId = chatData.conversation_id;
            }
          }

          if (data.event === 'conversation.message.delta' || data.type === 'conversation.message.delta') {
            // 流式增量内容
            const msgData = data.data || data;
            const content = msgData.content || '';
            if (content && msgData.role === 'assistant') {
              fullText += content;
              bubble.innerHTML = renderMarkdown(fullText);
              scrollToBottom();
            }
          }

          if (data.event === 'conversation.message.completed' || data.type === 'conversation.message.completed') {
            // 消息完成
            const msgData = data.data || data;
            if (msgData.role === 'assistant' && msgData.content) {
              // 用完整内容更新，避免增量遗漏
              fullText = msgData.content;
              bubble.innerHTML = renderMarkdown(fullText);
              scrollToBottom();
            }
          }

          if (data.event === 'conversation.chat.completed' || data.type === 'conversation.chat.completed') {
            const chatData = data.data || data;
            if (chatData.conversation_id) {
              conversationId = chatData.conversation_id;
            }
          }

          // 通用兜底：如果 data 有 content 字段且角色是 assistant
          if (data.content && data.role === 'assistant') {
            fullText = data.content;
            bubble.innerHTML = renderMarkdown(fullText);
            scrollToBottom();
          }

          // 错误事件
          if (data.event === 'error' || data.code !== undefined && data.code !== 0) {
            const errMsg = data.msg || data.message || '未知错误';
            throw new Error(errMsg);
          }
        }
      }

      // 如果没有收到任何内容
      if (!fullText.trim()) {
        bubble.innerHTML = '<span style="color: var(--text-muted);">（助手未返回内容）</span>';
      }

    } catch (err) {
      console.error('Chat error:', err);
      hideTypingIndicator();

      if (!fullText.trim()) {
        bubble.remove();
      }

      const errMsg = err.message.includes('Failed to fetch') || err.message.includes('NetworkError')
        ? '连接失败，请检查网络'
        : '请求失败: ' + err.message;
      showError(errMsg);
    } finally {
      isSending = false;
      setInputEnabled(true);
    }
  }

  // ── 事件绑定 ──
  sendBtn.addEventListener('click', () => {
    sendMessage(inputField.value);
  });

  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputField.value);
    }
  });

  // ── 开场白 ──
  function showWelcome() {
    const bubble = createBotMessage();
    const welcomeText = '你好！我是购房决策助手。告诉我你想看的城市和预算，我来帮你分析。';
    let i = 0;

    function typeChar() {
      if (i < welcomeText.length) {
        bubble.textContent = welcomeText.slice(0, i + 1);
        i++;
        scrollToBottom();
        setTimeout(typeChar, 30);
      }
    }

    typeChar();
  }

  showWelcome();
})();
</script>
</body>
</html>
