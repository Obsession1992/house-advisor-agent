<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>obsession-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0d1117; --bar-bg: #161b22; --accent: #39d353; --text: #c9d1d9; --text-muted: #8b949e; --border: #30363d; }
  html, body { height: 100%; overflow: hidden; font-family: 'JetBrains Mono', 'Noto Sans SC', monospace; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100vh; position: relative; }
  .topbar { flex-shrink: 0; height: 56px; background: var(--bar-bg); border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; padding: 0 20px; z-index: 10; }
  .topbar__title { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; display: flex; align-items: center; gap: 2px; }
  .cursor { display: inline-block; width: 10px; height: 20px; background: var(--accent); margin-left: 4px; animation: blink 1s step-end infinite; vertical-align: middle; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .topbar__back { position: absolute; right: 20px; font-family: 'JetBrains Mono', 'Noto Sans SC', monospace; font-size: 13px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; white-space: nowrap; }
  .topbar__back:hover { color: var(--accent); }
  .chat-container { flex: 1; overflow: hidden; display: flex; justify-content: center; align-items: stretch; padding: 0; }
  #coze-chat { width: 100%; max-width: 900px; height: 100%; }
  @media (max-width: 600px) { .topbar { height: 48px; padding: 0 12px; } .topbar__title { font-size: 13px; } .cursor { width: 8px; height: 16px; } .topbar__back { font-size: 11px; right: 12px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__title">&gt; obsession-agent<span class="cursor"></span></div>
    <a class="topbar__back" href="index.html">← 返回作品集</a>
  </header>
  <div class="chat-container">
    <div id="coze-chat"></div>
  </div>
</div>
<script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
<script>
  cozeWebSDK.init({
    projectId: '7667421523694665766',
    token: 'pat_vGNN9d2mcyZmINSHESLwYB27HyIQeDvKk4YyWMYD8Zt7IjewvAYTHQEPTSBqbIr0',
    container: document.getElementById('coze-chat'),
    theme: 'dark',
    style: 'width: 100%; height: 100%; border: none;'
  });
</script>
</body>
</html>
